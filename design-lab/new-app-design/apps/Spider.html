<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spider — Webwork</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="_shared.css">
<style>
.web-stage { padding: 24px 28px; position: relative; min-height: 660px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 0%, rgba(155,123,255,0.06), transparent 60%); }

.web-bar { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.web-bar .stat { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text); letter-spacing: 0.08em; }
.web-bar .stat b { color: var(--accent); }
.web-bar .pip { display: inline-flex; gap: 4px; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border-light);
  background: rgba(0,0,0,0.18); margin-left: 14px; }
.web-bar .pip i { width: 14px; height: 18px; border-radius: 2px;
  background: linear-gradient(180deg, #f4f0ea, #d4cdc0); display: inline-block; box-shadow: 0 1px 2px rgba(0,0,0,0.4); }
.web-bar .pip i.spent { opacity: 0.18; background: #1a2433; box-shadow: none; }
.web-bar .right { margin-left: auto; display: flex; gap: 8px; }
.web-bar .difficulty { padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border-light);
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text); letter-spacing: 0.10em; cursor: pointer; }
.web-bar .difficulty.active { color: var(--accent); border-color: rgba(var(--accent-rgb),0.4); background: rgba(var(--accent-rgb),0.08); }

/* 10 columns */
.spider-tableau { display: grid; grid-template-columns: repeat(10, 56px); gap: 12px; justify-content: center; margin-top: 10px; position: relative; z-index: 2; }
.s-col { position: relative; min-height: 360px; }
.s-card { position: absolute; left: 0; width: 56px; height: 78px; border-radius: 6px;
  background: linear-gradient(180deg, #f4f0ea, #d4cdc0);
  font-family: 'Georgia', serif; color: #0c0c0c; padding: 5px 6px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(0,0,0,0.08); }
.s-card.red { color: #c5152e; }
.s-card.back { background:
    repeating-linear-gradient(45deg, rgba(155,123,255,0.18), rgba(155,123,255,0.18) 4px, transparent 4px, transparent 8px),
    radial-gradient(circle, #1c1233, #0a0418 70%); color: transparent; }
.s-card.back::after { content: '🕸'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--violet); font-size: 18px; opacity: 0.7; }
.s-card .r { font-size: 12px; line-height: 1; font-weight: 500; }
.s-card .s { font-size: 10px; }
.s-card .c { position: absolute; left: 50%; top: 56%; transform: translate(-50%,-50%); font-size: 22px; }
.s-card.thread { box-shadow: 0 0 0 2px rgba(155,123,255,0.6), 0 0 14px rgba(155,123,255,0.4), 0 2px 5px rgba(0,0,0,0.4); }

/* Web threads SVG overlay */
.threads { position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.6; }

.foundations-row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 18px; padding-right: 8px; }
.found-stack { width: 56px; height: 78px; border-radius: 6px; border: 1px dashed rgba(255,255,255,0.10);
  display: grid; place-items: center; font-family: 'Georgia', serif; font-size: 18px; color: var(--text-dim); }
.found-stack.done { border: 1px solid rgba(155,123,255,0.4); background: linear-gradient(180deg, rgba(155,123,255,0.18), rgba(155,123,255,0.06));
  color: var(--violet); }

.bottom-bar { position: absolute; left: 24px; right: 24px; bottom: 18px; display: flex; align-items: center; gap: 14px;
  padding: 12px 18px; border-radius: 14px; background: rgba(0,0,0,0.34); border: 1px solid var(--border-light); z-index: 5; }
.bottom-bar .leg { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.10em; }
.bottom-bar .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--violet); margin-right: 6px; vertical-align: middle; box-shadow: 0 0 8px var(--violet); }
.bottom-bar .right { margin-left: auto; display: flex; gap: 8px; }
.btn-c { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-light); background: rgba(0,0,0,0.2);
  color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.10em; text-transform: uppercase; cursor: pointer; transition: all var(--cinematic); }
.btn-c:hover { color: var(--accent); border-color: rgba(var(--accent-rgb),0.3); }
.btn-c.primary { background: linear-gradient(180deg, var(--accent-bright), var(--accent)); color: #001a14; border-color: rgba(var(--accent-rgb),0.5); }
</style></head>
