<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Image sources, locked down. Backstop for the v1.10.11 wallpaper
       beacon: an off-origin url() smuggled into a storage marker cannot
       fetch even if a future sink lets one through. The extension gets
       the same directive from manifest.json's extension_pages CSP; this
       meta tag is what covers the STANDALONE WEB APP, which has no
       manifest. Sources: 'self' = local assets; data: = Photos, custom
       wallpapers, generated icons; blob: = PDF page renders and
       thumbnails; the two Google hosts = bookmark favicons (cookieless,
       see privacy.html).

       BOTH favicon hosts are required and neither is optional:
       s2.googleusercontent.com is the URL we request, and it 302s to
       t*.gstatic.com. CSP re-checks every redirect target and blocks on
       the destination while reporting the ORIGINAL URI — so allowing
       only the host we type silently kills every favicon and blames the
       wrong URL. Verified live; see tests/csp.test.js.

       connect-src is the other half: it bounds where the app may TALK,
       so a smuggled URL cannot exfiltrate even if it reaches a fetch.
       Open-Meteo is three separate subdomains (api, geocoding-api,
       air-quality-api) — all three are required. -->
  <meta http-equiv="Content-Security-Policy"
    content="img-src 'self' data: blob: https://s2.googleusercontent.com https://*.gstatic.com;
             connect-src 'self' data: blob: https://api.open-meteo.com https://geocoding-api.open-meteo.com https://air-quality-api.open-meteo.com https://api.weather.gov https://nominatim.openstreetmap.org" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="YancoTab — Your personal desktop in every new tab. Apps, games, notes, weather — all running locally." />
  <meta name="theme-color" content="#060b14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="./favicon.ico" />
  <title>YancoTab</title>

<body>

  <div id="boot" class="boot-screen" aria-live="polite">
    <div class="boot-glow">
      <img class="boot-logo" src="./assets/icons/icon-128.png" alt="YancoTab" style="width:80px;height:80px;" />
      <div class="boot-text">YancoTab</div>

    </div>

  </div>
