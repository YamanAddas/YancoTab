version: 2
# YancoTab has zero runtime dependencies (CLAUDE.md non-negotiable #1) and
# pins no npm devDependencies in package.json. Dependabot stays configured
# so GitHub-native dependency-update tooling is recognized and so any
# future devDep additions get picked up automatically.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
