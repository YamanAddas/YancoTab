<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YancoTab — Promo Tile Generator (440×280)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0f1a;
    color: #e0ecf5;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  h1 { font-size: 24px; font-weight: 300; letter-spacing: 0.04em; }
  h2 { font-size: 16px; font-weight: 400; color: #00e5c1; margin-bottom: 12px; }
  .section { text-align: center; }
  canvas {
    border: 1px solid rgba(0, 229, 193, 0.2);
    border-radius: 4px;
    max-width: 100%;
    height: auto;
    display: block;
  }
  .download-btn {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 24px;
    background: #00e5c1;
    color: #060b14;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .download-btn:hover { background: #00ffd4; }
  .info { font-size: 12px; color: rgba(200,220,240,0.5); margin-top: 8px; }
</style>
</head>
<body>

<h1>YancoTab — Chrome Web Store Promotional Tile</h1>

<div class="section">
  <h2>Small Promo Tile (440 × 280)</h2>
  <canvas id="promo" width="440" height="280"></canvas>
  <br>
  <button class="download-btn" onclick="download('promo', 'promo-tile-440x280.png')">Download Promo Tile</button>
  <div class="info">Required for CWS listing. No rounded corners (store crops them). No white border.</div>
</div>

<script>
const BG = '#060b14';
const BG_MID = '#0c1628';
const ACCENT = '#00e5c1';
const ACCENT_RGB = '0, 229, 193';

const logo = new Image();
logo.src = 'yancotab-clean.png';
logo.onload = () => drawPromo();

function drawPromo() {
  const c = document.getElementById('promo');
  const ctx = c.getContext('2d');
  const W = 440, H = 280;

  // Background — diagonal cosmic gradient
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, BG);
  bgGrad.addColorStop(0.5, BG_MID);
  bgGrad.addColorStop(1, BG);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Starfield dots (subtle, ~50 stars)
  const rng = mulberry32(8913);
  for (let i = 0; i < 50; i++) {
    const x = rng() * W;
    const y = rng() * H;
    const r = rng() * 1.0 + 0.3;
    const a = rng() * 0.5 + 0.2;
    const teal = rng() < 0.18;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = teal
      ? `rgba(${ACCENT_RGB}, ${a * 0.7})`
      : `rgba(200, 220, 240, ${a * 0.5})`;
    ctx.fill();
  }

  // Teal accent glow behind logo (left)
  const glow = ctx.createRadialGradient(135, H / 2, 20, 135, H / 2, 180);
  glow.addColorStop(0, `rgba(${ACCENT_RGB}, 0.18)`);
  glow.addColorStop(0.5, `rgba(${ACCENT_RGB}, 0.06)`);
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Logo on the left (preserves the YancoTab brand mark)
  const logoSize = 180;
  const lx = 135 - logoSize / 2;
  const ly = (H - logoSize) / 2;
  ctx.drawImage(logo, lx, ly, logoSize, logoSize);

  // Right side text block
  const textX = 245;

  // Title
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 28px "Segoe UI", system-ui, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText('YancoTab', textX, 105);

  // Tagline (two lines)
  ctx.fillStyle = 'rgba(220, 230, 245, 0.85)';
  ctx.font = '500 14px "Segoe UI", system-ui, sans-serif';
  ctx.fillText('Your desktop,', textX, 138);
  ctx.fillText('in every new tab.', textX, 158);

  // Accent underline below tagline
  const underlineGrad = ctx.createLinearGradient(textX, 0, textX + 130, 0);
  underlineGrad.addColorStop(0, `rgba(${ACCENT_RGB}, 0.7)`);
  underlineGrad.addColorStop(1, `rgba(${ACCENT_RGB}, 0)`);
  ctx.fillStyle = underlineGrad;
  ctx.fillRect(textX, 175, 130, 2);

  // Feature dots
  ctx.fillStyle = 'rgba(200, 220, 240, 0.55)';
  ctx.font = '400 11px "Segoe UI", system-ui, sans-serif';
  ctx.fillText('• 18 apps  • No tracking  • Free', textX, 205);
}

function download(canvasId, filename) {
  const c = document.getElementById(canvasId);
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = filename;
  a.click();
}

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
</script>

</body>
</html>
